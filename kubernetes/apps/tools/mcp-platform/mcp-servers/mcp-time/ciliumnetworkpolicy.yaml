---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-time
  namespace: mcp-platform
spec:
  endpointSelector:
    matchLabels:
      app: mcp-time
  enableDefaultDeny:
    egress: true
    ingress: false
  egressDeny:
    - toEntities:
        - all
