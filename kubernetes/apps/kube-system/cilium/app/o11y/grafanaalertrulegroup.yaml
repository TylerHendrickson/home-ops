---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanaalertrulegroup_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: dns-visibility-cardinality
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  allowCrossNamespaceImport: true
  folderRef: dns-egress-visibility
  interval: 5m
  rules:
    - uid: dns-visibility-query-cardinality
      title: DNSVisibilityQueryCardinalityHigh
      condition: B
      for: 6h
      noDataState: OK
      execErrState: OK
      labels:
        severity: warning
      annotations:
        summary: >-
          DNS egress visibility is tracking an abnormal number of distinct queries
        description: >-
          The number of distinct DNS names seen across the cluster has grown well beyond its normal
          range. This usually means some workload is resolving an unbounded stream of domains (often
          randomized subdomains), which both points to unusual behavior worth a look and steadily
          bloats Prometheus with permanent new series. Find the responsible workload and domain
          pattern with `topk(20, count by (source_workload, query)(hubble_dns_queries_total))`; if the
          pattern is expected, exclude it from the DNS metrics — otherwise investigate the workload.
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: 'count(hubble_dns_queries_total)'
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: active dns query series
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  # Coarse ceiling above the normal series count; tune down once
                  # a steady-state baseline is known.
                  type: gt
                  params:
                    - 5000
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []

    - uid: dns-visibility-query-cardinality-spike
      title: DNSVisibilityQueryCardinalitySpike
      # Measured over a short window but held for a longer period, so a transient
      # burst (e.g. a deploy) can't trip it — only sustained growth does.
      condition: B
      for: 1h
      noDataState: OK
      execErrState: OK
      labels:
        severity: warning
      annotations:
        summary: >-
          DNS egress visibility query cardinality is climbing rapidly
        description: >-
          The number of distinct DNS names seen across the cluster is growing fast, which usually
          means some workload has started resolving an unbounded stream of domains (often randomized
          subdomains). Left unchecked this bloats Prometheus with permanent new series. Find the
          responsible workload and domain pattern with
          `topk(20, count by (source_workload, query)(hubble_dns_queries_total))`; if the pattern is
          expected, exclude it from the DNS metrics — otherwise investigate the workload.
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 2400
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: 'count(hubble_dns_queries_total) - count(hubble_dns_queries_total offset 30m)'
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: net new dns query series (30m)
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  # Net new distinct series per 30m that clears normal churn;
                  # tune once a steady-state baseline is known.
                  type: gt
                  params:
                    - 500
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanaalertrulegroup_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: egress-policy-verdicts
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  allowCrossNamespaceImport: true
  folderRef: dns-egress-visibility
  interval: 1m
  rules:
    - uid: egress-policy-denied
      title: EgressPolicyDenied
      condition: B
      for: 0m
      noDataState: OK
      execErrState: OK
      dashboardUid: cilium-dns-egress-visibility
      panelId: 8
      labels:
        severity: critical
      annotations:
        summary: >-
          Network policy blocked egress from
          {{ if $labels.source }}{{ $labels.source }}{{ else }}an unlabeled pod{{ end }}.
        description: >-
          Either the policy is too strict and is blocking legitimate traffic, or the workload
          reached for a destination it was never allowed. Blocked destinations are on the linked
          "Policy verdicts by workload" panel.
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 1200
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: 'sum by (source) (increase(hubble_policy_verdicts_total{action="dropped", direction="egress"}[10m]))'
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange:
            from: 1200
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
