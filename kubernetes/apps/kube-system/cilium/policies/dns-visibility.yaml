---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
#
# Redirects matched workloads' DNS through Cilium's L7 DNS proxy so Hubble
# annotates to-World egress flows with FQDNs instead of just raw IPs.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: dns-visibility
spec:
  endpointSelector:
    # Infra namespaces are excluded: routing CoreDNS's own upstream queries
    # (kube-system) back through the DNS proxy risks a resolution loop, and
    # Flux's control-plane lookups (flux-system) shouldn't hinge on the proxy.
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - flux-system
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
