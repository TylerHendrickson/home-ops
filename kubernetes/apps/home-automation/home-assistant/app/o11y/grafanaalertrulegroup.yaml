---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanaalertrulegroup_v1beta1.json
# Alerts on the edradour (${EDRADOUR_IP}) tarclone backup, scraped as job="backup-cron" by the
# edradour-backup-cron ScrapeConfig (see scrapeconfig.yaml).
#
# supercronic partitions its counters by the `command` label, so an image/command change
# (e.g. the tar-backup -> tarclone migration) spawns a fresh series that starts at 0.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: edradour-backup
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  allowCrossNamespaceImport: true
  folderRef: home-assistant
  interval: 1m
  rules:
    # A scheduled run explicitly failed. The condition stays true for 26h after the failure.
    - uid: edradour-backup-run-failed
      title: EdradourBackupRunFailed
      condition: B
      for: 12h
      # Absent failed series => no failures => NoData => Normal.
      noDataState: OK
      execErrState: OK
      labels:
        severity: critical
      annotations:
        summary: >-
          edradour nightly backup (tarclone) reported a failed run.
        description: >-
          supercronic_failed_executions for job=backup-cron on edradour increased in the last
          26h — a scheduled tarclone backup of /home/pi/ha to the NAS exited non-zero or was killed.
          Check the tarclone container logs on edradour.
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 94200
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: 'sum by (job, instance) (increase(supercronic_failed_executions{job="backup-cron"}[26h]))'
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange:
            from: 94200
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []

    # Heartbeat: no *successful* backup in 36h.
    - uid: edradour-backup-no-recent-success
      title: EdradourBackupNoRecentSuccess
      condition: B
      for: 30m
      noDataState: OK
      execErrState: OK
      labels:
        severity: critical
      annotations:
        summary: >-
          edradour nightly backup (tarclone) has not succeeded in 36h.
        description: >-
          supercronic_successful_executions for job=backup-cron on edradour shows no successful
          run for the past 36h. The job may not be firing, or is still running (or otherwise not reporting exit)
          and preventing new jobs from starting due to lock contention.
          Check tarclone container and its schedule on edradour.
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 130200
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: 'sum by (job, instance) (increase(supercronic_successful_executions{job="backup-cron"}[36h]))'
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange:
            from: 130200
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            # < 0.5 == "no whole successful run in the window" (increase() extrapolation
            # keeps a real single success comfortably above 0.5, true-zero stays at 0).
            conditions:
              - type: query
                evaluator:
                  type: lt
                  params:
                    - 0.5
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []

    # The scrape target itself is down — supercronic / container / host / network.
    # `up` is synthesized per configured target, so a failed scrape is up=0 (fires), not absent.
    - uid: edradour-backup-exporter-down
      title: EdradourBackupExporterDown
      condition: B
      for: 1h
      noDataState: OK
      execErrState: OK
      labels:
        severity: warning
      annotations:
        summary: >-
          edradour backup metrics endpoint is down (job=backup-cron).
        description: >-
          Prometheus failed to scrape the tarclone/supercronic metrics endpoint on edradour
          for the past hour. The container, host, or network path is likely down.
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 300
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: 'up{job="backup-cron"}'
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange:
            from: 300
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: lt
                  params:
                    - 1
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
